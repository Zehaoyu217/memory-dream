<!doctype html>
<!-- what: a knowledge graph: every thing and every link between two of them, on islands by project, folder or community | for: showing what a memory (or any graph) holds, offline, in one file (filled by memory.py write_kg, or demo/knowledge-graph/build.py) -->
<html lang="en" data-theme="@@THEME@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<script id="pkg-d3">
@@D3@@
</script>
<style id="base">
  :root {
    --paper:#f6f6f3; --sheet:#ffffff; --tint:#efefeb; --ink:#191d22; --muted:#5d6670; --faint:#9aa1a9;
    --accent:#2f5fd0; --out:#2f5fd0; --in:#d07a2a; --edge-rgb:25,29,34; --halo:rgba(246,246,243,.94);
    --head:156px; --panel:400px; --radius:16px;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:"Iowan Old Style","Charter","Source Serif Pro",Georgia,serif;
    --shadow:0 1px 2px rgba(25,29,34,.05),0 10px 32px rgba(25,29,34,.09);
    --edge2-rgb:25,29,34; --isle:rgba(25,29,34,.52); --on-accent:#ffffff; --ring:rgba(47,95,208,.25); --accent-soft:rgba(47,95,208,.07);
    --accent-soft-2:rgba(47,95,208,.13); --in-soft:rgba(208,122,42,.12); --label:var(--muted); --figure:var(--ink); --display-weight:500;
    --row:var(--paper); --row-hover:var(--tint); --corner:none; --mark:none; --blur:none; --corner-c:transparent; --panel-radius:20px;
    --display-style:normal; --zig:transparent;
  }
  /* the star map: the same page at night; a look, not a game's: no names, marks or art from one */
  :root[data-theme="star"] {
    color-scheme:dark;
    --paper:#060a16; --sheet:rgba(15,21,42,.74); --tint:rgba(255,255,255,.07); --ink:#eef1fa; --muted:#a6b0cb; --faint:#6f7a98;
    --accent:#e6c27a; --out:#7cc8ff; --in:#f2b45c; --edge-rgb:150,175,255; --edge2-rgb:232,198,128; --halo:rgba(6,10,22,.88);
    --isle:rgba(232,198,128,.86); --on-accent:#1b1405; --ring:rgba(230,194,122,.38); --accent-soft:rgba(230,194,122,.10);
    --accent-soft-2:rgba(230,194,122,.18); --in-soft:rgba(242,180,92,.14); --label:#e6c27a; --figure:#f4dca6; --display-weight:400;
    --radius:8px; --font:"Avenir Next","Avenir","Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:"Avenir Next","Avenir","Futura","Segoe UI","Helvetica Neue",sans-serif;
    --shadow:0 0 0 1px rgba(230,194,122,.20),0 18px 50px rgba(0,0,0,.55);
    --row:rgba(255,255,255,.045); --row-hover:rgba(255,255,255,.09); --corner:""; --mark:"◆"; --blur:blur(16px) saturate(1.25);
    --corner-c:rgba(230,194,122,.9); --panel-radius:8px;
  }
  /* the gala: a purple show at night, starlight and moonlight, lotto wheels and confetti; a look, not a game's */
  :root[data-theme="gala"] {
    color-scheme:dark;
    --paper:#140726; --sheet:rgba(40,15,66,.70); --tint:rgba(255,255,255,.08); --ink:#f7f0ff; --muted:#c5b4de; --faint:#8d7aab;
    --accent:#ff7ad9; --out:#62d4ff; --in:#ffcf5c; --edge-rgb:178,140,255; --edge2-rgb:255,120,210; --halo:rgba(22,8,40,.88);
    --isle:rgba(255,216,150,.92); --on-accent:#2a0b3d; --ring:rgba(255,122,217,.42); --accent-soft:rgba(255,122,217,.12);
    --accent-soft-2:rgba(255,122,217,.22); --in-soft:rgba(255,207,92,.16); --label:#ffd27a; --figure:#ffe2a8; --display-weight:400;
    --display-style:italic; --radius:14px; --panel-radius:18px;
    --font:"Avenir Next","Avenir","Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:"Bodoni 72","Didot","Bodoni MT","Playfair Display",Georgia,serif;
    --shadow:0 0 0 1px rgba(255,122,217,.30),0 0 26px rgba(176,90,255,.20),0 18px 50px rgba(0,0,0,.5);
    --row:rgba(255,255,255,.05); --row-hover:rgba(255,255,255,.10); --corner:""; --mark:"✦"; --blur:blur(18px) saturate(1.4);
    --corner-c:rgba(255,207,92,.95);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.45 var(--font); -webkit-font-smoothing:antialiased;
         display:grid; grid-template-columns:1fr; grid-template-rows:minmax(var(--head), auto) 1fr; overflow:hidden; transition:background-color .5s, color .5s; }
  :root[data-theme="star"] body { background:radial-gradient(1100px 620px at 80% -10%, #1c2656 0%, rgba(28,38,86,0) 62%),
                                  radial-gradient(900px 520px at 6% 110%, #2a1745 0%, rgba(42,23,69,0) 58%), #060a16; }
  :root[data-theme="gala"] body { background:radial-gradient(900px 560px at 50% -18%, #5b2192 0%, rgba(91,33,146,0) 62%),
                                  radial-gradient(760px 520px at 102% 104%, #7d1f70 0%, rgba(125,31,112,0) 58%),
                                  radial-gradient(640px 480px at -4% 62%, #2c1c78 0%, rgba(44,28,120,0) 60%),
                                  radial-gradient(circle 15px at 63% 34px, #fff4dc 0 62%, rgba(255,244,220,0) 100%),
                                  radial-gradient(circle 90px at 63% 34px, rgba(255,214,150,.16) 0%, rgba(255,214,150,0) 72%), #140726; }
  body > [data-span="full"] { grid-column:1 / -1; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  input { font:inherit; color:inherit; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; flex:none; }
  .eyebrow { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--label); }
  .eyebrow::before { content:var(--mark); margin-right:.6em; font-size:.85em; color:var(--accent); }
  .float { background:var(--sheet); border-radius:var(--radius); box-shadow:var(--shadow); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
           transition:background-color .5s, box-shadow .5s; }
  .float::before, .float::after { content:var(--corner); position:absolute; width:11px; height:11px; pointer-events:none; border:0 solid var(--accent); }
  .float::before { top:-1px; left:-1px; border-width:1.5px 0 0 1.5px; }
  .float::after { bottom:-1px; right:-1px; border-width:0 1.5px 1.5px 0; }
  :root[data-theme="star"] .float, :root[data-theme="gala"] .float { position:relative; }
  /* moonlit: a stage in moonlight, after a lilac-and-plum outfit with roses: pale lilac and silver, plum and rose for
     accents, a great moon, sparkles and ribbons; a look, not a game's: no names, marks or art from one */
  :root[data-theme="moon"] {
    --paper:#efe9f9; --sheet:rgba(255,255,255,.66); --tint:rgba(91,63,134,.07); --ink:#2a1838; --muted:#655478; --faint:#9a8cae;
    --accent:#c93f7a; --out:#6a4bd6; --in:#d6457f; --edge-rgb:74,44,112; --edge2-rgb:201,63,122; --halo:rgba(244,240,252,.92);
    --isle:rgba(78,52,120,.8); --on-accent:#ffffff; --ring:rgba(201,63,122,.30); --accent-soft:rgba(201,63,122,.09);
    --accent-soft-2:rgba(201,63,122,.16); --in-soft:rgba(214,69,127,.12); --label:#8a4fc4; --figure:#3b2152; --display-weight:400;
    --display-style:italic; --radius:16px; --panel-radius:20px;
    --font:"Avenir Next","Avenir","Segoe UI","Helvetica Neue",Arial,sans-serif;
    --serif:"Bodoni 72","Didot","Bodoni MT","Playfair Display",Georgia,serif;
    --shadow:0 1px 2px rgba(74,44,112,.08),0 12px 36px rgba(110,80,170,.18);
    --row:rgba(255,255,255,.55); --row-hover:rgba(255,255,255,.88); --corner:none; --mark:"♦"; --blur:blur(14px) saturate(1.2);
    --corner-c:transparent; --zig:#3b2152;
  }
  :root[data-theme="moon"] body { background:
      radial-gradient(circle 150px at 79% 47%, rgba(255,255,255,.96) 0 68%, rgba(255,255,255,0) 100%),
      radial-gradient(circle 470px at 79% 47%, rgba(255,255,255,.62) 0%, rgba(255,255,255,0) 72%),
      radial-gradient(1000px 640px at 8% 106%, rgba(150,160,240,.45) 0%, rgba(150,160,240,0) 62%),
      radial-gradient(900px 520px at 42% -12%, rgba(214,186,255,.55) 0%, rgba(214,186,255,0) 60%),
      linear-gradient(160deg, #f4effb 0%, #e4daf6 55%, #d7cdf3 100%); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
<script id="lib">
const DP = {
  read: id => JSON.parse(document.getElementById(id).textContent),
  esc: s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]),
  num: n => Number(n).toLocaleString('en-US'),
  still: () => matchMedia('(prefers-reduced-motion: reduce)').matches,
  look: () => document.documentElement.dataset.theme || 'paper',   // paper, star (a star map), gala (a purple show), moon (moonlit)
  tone: (c, groups) => {             // a group's colour for the look in use: the star map lifts it so it glows on the dark;
    const look = DP.look();          // the gala gives each group a colour of its show, by its place among `groups` (the legend's order)
    if (look === 'paper') return c;
    if (look === 'gala' || look === 'moon') {        // moonlit: plum, violet, rose, periwinkle, gold, teal, lilac, pink
      const i = (groups || []).findIndex(g => g.color === c), pal = look === 'gala'
        ? ['#ff6fcf', '#b48bff', '#62d4ff', '#ffd36e', '#7fe3b8', '#ff9478', '#e3bdff', '#8fa8ff']
        : ['#4b2a6b', '#7b5cd6', '#d6457f', '#5f7ee0', '#d4a24c', '#3fae9a', '#a98be6', '#e07a9e'];
      return i >= 0 && groups[i].g !== 'other' ? pal[i % 8] : (look === 'gala' ? '#cfc6e4' : '#a49cb8');
    }
    const h = d3.hsl(c); h.l = Math.min(0.8, Math.max(0.64, h.l + 0.26)); h.s = Math.min(0.92, h.s * 1.3 + 0.08); return h.formatHex();
  },
};
</script>
</head>
<body>
<header id="masthead" data-span="full">
  <style>
    #masthead { position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:40px; padding:26px 40px 20px; }
    #masthead > * { animation:masthead-up .9s cubic-bezier(.2,.8,.2,1) both; }
    #masthead dl { animation-delay:.18s; }
    #masthead h1 { margin:8px 0 6px; font:var(--display-style) var(--display-weight) 32px/1.08 var(--serif); letter-spacing:-.012em; }
    #masthead p { margin:0; color:var(--muted); max-width:820px; }
    #masthead dl { display:flex; gap:40px; margin:0 0 2px; }
    #masthead dl div { display:flex; flex-direction:column-reverse; gap:3px; }
    #masthead dt { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    #masthead dd { margin:0; font:var(--display-weight) 28px/1 var(--serif); font-variant-numeric:tabular-nums; color:var(--figure); }
    #masthead .looks { position:absolute; top:18px; right:40px; display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--tint);
                       animation-delay:.3s; transition:background .5s; }
    #masthead .looks button { height:26px; padding:0 12px; border-radius:999px; font-size:12px; color:var(--muted); transition:color .2s, background .3s, box-shadow .3s; }
    #masthead .looks button:hover { color:var(--ink); }
    #masthead .looks button[aria-pressed="true"] { background:var(--sheet); color:var(--ink); box-shadow:0 0 0 1px var(--accent-soft-2); }
    @keyframes masthead-up { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @media (max-width:980px) { #masthead dl { display:none; } }
    @media (prefers-reduced-motion: reduce) { #masthead > * { animation:none; } }
  </style>
  <div>
    <div class="eyebrow">@@EYEBROW@@</div>
    <h1>@@HEADLINE@@</h1>
    <p>@@LEDE@@</p>
  </div>
  <dl>@@STATS@@</dl>
  <div class="looks" role="group" aria-label="The look of the page"><button data-look="paper">Paper</button><button data-look="star">Star map</button><button data-look="gala">Gala</button><button data-look="moon">Moonlit</button></div>
  <script>
  (() => {
    const looks = document.querySelector('#masthead .looks');
    const show = () => looks.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.look === DP.look() ? 'true' : 'false'));
    looks.addEventListener('click', e => {             // the look is a view, like a tab: one attribute on the page, then word to the rest
      const b = e.target.closest('button'); if (!b || b.dataset.look === DP.look()) return;
      document.documentElement.dataset.theme = b.dataset.look; show();
      document.dispatchEvent(new CustomEvent('dp:theme', { detail: { theme: b.dataset.look } }));
    });
    show();
    if (DP.still()) return;
    document.querySelectorAll('#masthead dd').forEach((dd, k) => {   // the numbers count up as the graph blooms
      const to = Number(dd.textContent.replace(/[^0-9]/g, '')), t0 = performance.now() + 220 + 90 * k;
      const step = now => { const p = Math.max(0, Math.min(1, (now - t0) / 1500)); dd.textContent = DP.num(Math.round(to * d3.easeCubicOut(p))); if (p < 1) requestAnimationFrame(step); };
      dd.textContent = '0'; requestAnimationFrame(step);
    });
  })();
  </script>
</header>

<section id="graph" data-span="full">
  <style>
    #graph { position:relative; min-height:0; }
    #graph canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; transition:opacity .28s; }
    #graph.switching canvas { opacity:0; }
    #graph canvas.over { cursor:pointer; }
    #graph canvas.held { cursor:grabbing; }
    #graph .tools { position:absolute; right:24px; bottom:24px; display:flex; align-items:flex-end; gap:10px; transition:right .45s cubic-bezier(.2,.8,.2,1); animation:graph-rise .8s .6s cubic-bezier(.2,.8,.2,1) both; }
    #graph.panel .tools { right:calc(var(--panel) + 44px); }
    #graph .zoom { display:flex; flex-direction:column; padding:4px; }
    #graph .zoom button { width:38px; height:38px; border-radius:11px; font-size:18px; color:var(--muted); transition:background .15s, color .15s; }
    #graph .zoom button:hover { background:var(--tint); color:var(--ink); }
    #graph .tour { display:flex; align-items:center; gap:9px; height:46px; padding:0 18px 0 13px; font-weight:500; white-space:nowrap; transition:transform .2s; }
    #graph .tour:hover { transform:translateY(-1px); }
    #graph .tour i { width:22px; height:22px; border-radius:50%; background:var(--accent); display:grid; place-items:center; font-style:normal; color:var(--on-accent); font-size:9px; }
    #graph .tour.on i { background:var(--in); }
    #graph .tip { position:absolute; left:0; top:0; pointer-events:none; padding:9px 12px; border-radius:11px; font-size:12.5px; max-width:340px;
                  opacity:0; transform:translateY(4px); transition:opacity .14s, transform .14s; }
    #graph .tip.on { opacity:1; transform:none; }
    #graph .tip b { font-weight:600; display:block; }
    #graph .tip span { color:var(--muted); }
    #graph .tip em { display:block; margin-top:3px; font-style:normal; font-size:11.5px; color:var(--faint); }
    #graph .hint { position:absolute; left:50%; bottom:24px; transform:translateX(-50%); padding:6px 14px; border-radius:999px; background:var(--halo);
                   font-size:12px; color:var(--faint); white-space:nowrap; pointer-events:none; transition:opacity .8s; }
    #graph .hint.gone { opacity:0; }
    @keyframes graph-rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { #graph .tools { animation:none; transition:none; } }
  </style>
  <canvas aria-label="A graph of the things the notes name and the links between them"></canvas>
  <div class="tools"><button class="tour float" title="Fly through the main things, one after another"><i>▶</i><span>Take the tour</span></button><div class="zoom float"><button data-z="in" title="Zoom in">+</button><button data-z="out" title="Zoom out">−</button><button data-z="fit" title="Show everything">⤢</button></div></div>
  <div class="tip float"></div>
  <div class="hint">scroll to zoom · drag to move · click a thing or an island · / to search</div>
  <script>
  (() => {
    const groups = DP.read('data-groups'), things = DP.read('data-things'), raw = DP.read('data-links'), meta = DP.read('data-meta');
    const root = document.getElementById('graph'), canvas = root.querySelector('canvas'), ctx = canvas.getContext('2d');
    const tip = root.querySelector('.tip'), hint = root.querySelector('.hint'), tourBtn = root.querySelector('.tour');
    const css = getComputedStyle(document.documentElement), tok = n => css.getPropertyValue(n).trim();
    const PANEL = parseFloat(tok('--panel')) + 48, still = DP.still();
    let INK, MUTED, OUT, IN, HALO, EDGE, EDGE2, PAPER, ISLE, FONT, SERIF, NIGHT, GALA, MOON, colour;
    function paint() {                                    // the look's tokens, read again whenever the look changes
      INK = tok('--ink'); MUTED = tok('--muted'); OUT = tok('--out'); IN = tok('--in'); HALO = tok('--halo'); EDGE = tok('--edge-rgb');
      EDGE2 = tok('--edge2-rgb'); PAPER = tok('--paper'); ISLE = tok('--isle'); FONT = tok('--font'); SERIF = tok('--serif');
      NIGHT = DP.look() === 'star' || DP.look() === 'gala'; GALA = DP.look() === 'gala';   // the star map and the gala share the night
      MOON = DP.look() === 'moon';                        // moonlit is a light look of its own: a great moon, sparkles, ribbons, pearls
      colour = Object.fromEntries(groups.map(g => [g.g, DP.tone(g.color, groups)]));
    }
    paint();
    const rng = seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);   // the same layout every time
    const rand = rng(7), backOut = d3.easeBackOut.overshoot(1.6), cubicOut = d3.easeCubicOut, inOut = d3.easeCubicInOut;
    let raf = 0, last = performance.now(), drawn = 0, dirty = true, lastInput = performance.now(), haze = null;

    // ---- the things, their links, and the few hubs that link to nearly everything
    const cut = (s, n) => s.length > n ? s.slice(0, n - 2).trimEnd() + '…' : s;
    const nodes = things.map((t, i) => ({ ...t, i, r: 2.3 + 1.2 * Math.sqrt(t.n), x: 0, y: 0, short: cut(t.label, 30), long: cut(t.label, 46) }));
    const byId = new Map(nodes.map(n => [n.id, n]));
    const links = raw.map((l, k) => ({ k, source: nodes[l.s], target: nodes[l.t], type: l.type }));
    const deg = nodes.map(() => 0), around = nodes.map(() => []);
    links.forEach(l => { deg[l.source.i]++; deg[l.target.i]++; around[l.source.i].push(l); around[l.target.i].push(l); });
    const HUB = Math.max(36, d3.quantile(deg.slice().sort(d3.ascending), 0.995));
    nodes.forEach(n => { n.hub = deg[n.i] >= HUB; });
    links.forEach(l => { l.spoke = l.source.hub || l.target.hub; l.cross = l.source.home !== l.target.home; });
    const other = (l, n) => l.source === n ? l.target : l.source;

    // ---- islands: one per project, one per shared folder, and in the middle what several projects share
    const wrap = s => {
      if (s.length <= 16 || !s.includes(' ')) return [s];
      let at = -1;
      for (let i = 0; i < s.length; i++) if (s[i] === ' ' && (at < 0 || Math.abs(i - s.length / 2) < Math.abs(at - s.length / 2))) at = i;
      return [s.slice(0, at), s.slice(at + 1)];
    };
    const spaced = s => s.split('').join(String.fromCharCode(8202));
    const named = meta.isles || {};                       // {island: {name, kind}}; kind: project, folder, shared, cluster
    const isles = d3.groups(nodes, n => n.home).map(([h, ns]) => ({ h, ns, R: Math.sqrt(d3.sum(ns, n => (n.r + 3.6) ** 2) / 0.5), inside: 0, out: 0, hot: 0, grow: 1 }));
    const isleOf = new Map(isles.map(p => [p.h, p]));
    isles.forEach(p => {
      p.kind = (named[p.h] || {}).kind || (p.h ? 'project' : 'shared');
      p.folder = p.kind === 'folder';
      p.name = (named[p.h] || {}).name || (p.h ? p.h.replace(/-/g, ' ') : 'shared by several projects');
      p.lines = p.folder ? [p.name] : wrap(p.name.toUpperCase()).map(spaced);
      p.ns.forEach((n, j) => { n.j = j; });
      p.ns.slice().sort((a, b) => deg[b.i] - deg[a.i] || b.n - a.n).slice(0, 3).forEach((n, r) => { n.key = r + 1; });
    });
    links.forEach(l => { if (l.cross) { isleOf.get(l.source.home).out++; isleOf.get(l.target.home).out++; } else isleOf.get(l.source.home).inside++; });
    const share = new Map(), pair = (a, b) => a < b ? a + '|' + b : b + '|' + a;
    links.forEach(l => { if (l.cross && !l.spoke) { const k = pair(l.source.home, l.target.home); share.set(k, (share.get(k) || 0) + 1); } });
    const tie = (a, b) => share.get(pair(a, b)) || 0;
    const left = isles.slice().sort((a, b) => (a.h === '') - (b.h === '') || a.ns.length - b.ns.length);
    const order = [left.pop()];   // the middle first (or, with none, the largest island), then each island after the ones it shares most with
    while (left.length) {
      left.sort((a, b) => d3.sum(order, p => tie(p.h, a.h)) - d3.sum(order, p => tie(p.h, b.h)) || a.ns.length - b.ns.length || (a.h < b.h ? 1 : -1));
      order.push(left.pop());

        const lh = p.folder ? 15 : 12.5, w = Math.max(...p.lines.map(s => ctx.measureText(s).width)), hgt = p.lines.length * lh;
        const sx = t.applyX(p.x), top = t.applyY(p.y - p.D * p.grow) - 6, bottom = t.applyY(p.y + p.D * p.grow) + 6;

      if (pointed) cand.push(pointed);
      if (chosen) cand.push(chosen, ...around[chosen.i].map(l => other(l, chosen)).sort((a, b) => b.r - a.r));
      nodes.forEach(n => { if (n.r * k >= 6.5 || (n.hub && k > 0.3) || (n.key === 1 && k > 0.85) || (n.key && k > 1.5)) cand.push(n); });
      ctx.font = `500 11.5px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';

        const sx = t.applyX(n.x), y = t.applyY(n.y), right = W - (panelOpen ? PANEL : 0) - 6;

    const index = things.map(t => ({ t, keys: [t.label, ...(t.names || []), t.id].map(s => String(s).toLowerCase()) }));
    let hits = [], at = 0, q = '';
    const mark = s => { const k = s.toLowerCase().indexOf(q); return k < 0 ? DP.esc(s) : DP.esc(s.slice(0, k)) + '<mark>' + DP.esc(s.slice(k, k + q.length)) + '</mark>' + DP.esc(s.slice(k + q.length)); };
    const render = fresh => {
      list.classList.toggle('fresh', !!fresh);
      list.innerHTML = hits.map((t, k) => `<li><button class="${k === at ? 'on' : ''}" data-id="${DP.esc(t.id)}"><span class="dot" data-c="${colour[t.g]}"></span><span class="name">${mark(t.label)}</span><span class="kind">${DP.esc(t.type)}${meta.notes ? ` · ${DP.num(t.n)} note${t.n === 1 ? '' : 's'}` : ''}</span></button></li>`).join('');
      list.querySelectorAll('.dot').forEach(d => { d.style.background = DP.tone(d.dataset.c, groups); });
    };
    document.addEventListener('dp:theme', () => list.querySelectorAll('.dot').forEach(d => { d.style.background = DP.tone(d.dataset.c, groups); }));
    const find = () => {
      if (!q) return [];
      const score = x => x.keys.some(k => k === q) ? 3 : x.keys.some(k => k.startsWith(q)) ? 2 : x.keys.some(k => k.includes(q)) ? 1 : 0;
      return index.map(x => [score(x), x.t]).filter(s => s[0]).sort((a, b) => b[0] - a[0] || b[1].n - a[1].n).slice(0, 8).map(s => s[1]);
    };
    const go = id => { if (!id) return; document.dispatchEvent(new CustomEvent('dp:focus', { detail: { id } })); hits = []; render(); input.blur(); };
    input.addEventListener('input', () => { const was = hits.length; q = input.value.trim().toLowerCase(); hits = find(); at = 0; render(!was); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { at = Math.min(hits.length - 1, at + 1); render(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { at = Math.max(0, at - 1); render(); e.preventDefault(); }
      else if (e.key === 'Enter') go(hits[at] && hits[at].id);
      else if (e.key === 'Escape') { input.value = ''; q = ''; hits = []; render(); input.blur(); document.dispatchEvent(new CustomEvent('dp:clear', { detail: {} })); }
    });
    list.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.id); });
    document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); input.select(); } });
  })();
  </script>
</section>
<section id="legend" class="float">
  <style>
    #legend { position:fixed; left:28px; bottom:26px; z-index:4; width:272px; padding:16px 10px 12px; animation:legend-in .8s .5s cubic-bezier(.2,.8,.2,1) both; }
    #legend .eyebrow { padding:0 10px 8px; }
    #legend button { display:flex; align-items:center; gap:10px; width:100%; padding:6px 10px; border-radius:10px; font-size:13px; text-align:left; transition:background .15s, opacity .2s; }
    #legend button:hover { background:var(--tint); }
    #legend button[aria-pressed="false"] { opacity:.36; }
    #legend button .name { flex:1; }
    #legend button .n { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
    #legend .key { display:flex; gap:16px; padding:12px 10px 0; font-size:12px; color:var(--muted); }
    #legend .key b { font-weight:600; margin-right:3px; }
    #legend .key .out { color:var(--out); }
    #legend .key .in { color:var(--in); }
    #legend .help { padding:5px 10px 0; font-size:11.5px; color:var(--faint); }
    @keyframes legend-in { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @media (max-height:760px) { #legend .help { display:none; } }
    @media (prefers-reduced-motion: reduce) { #legend { animation:none; } }
  </style>
  <div class="eyebrow">Things</div>
  <div class="rows"></div>
  <div class="key"><span><b class="out">→</b>what it uses</span><span><b class="in">←</b>what uses it</span></div>
  <div class="help">Point to light a group; click to hide it.</div>
  <script>
  (() => {
    const groups = DP.read('data-groups'), things = DP.read('data-things');
    const root = document.getElementById('legend'), rows = root.querySelector('.rows');
    const count = g => things.filter(t => t.g === g).length;
    rows.innerHTML = groups.filter(g => count(g.g)).map(g => `<button aria-pressed="true" data-g="${g.g}"><span class="dot" data-c="${g.color}"></span><span class="name">${DP.esc(g.name)}</span><span class="n">${DP.num(count(g.g))}</span></button>`).join('');
    const tone = () => rows.querySelectorAll('.dot').forEach(d => { d.style.background = DP.tone(d.dataset.c, groups); });
    tone();
    document.addEventListener('dp:theme', tone);
    const hidden = new Set();
    let peeked = null;
    const peek = g => { if (g !== peeked) { peeked = g; document.dispatchEvent(new CustomEvent('dp:peek', { detail: { g } })); } };
    rows.addEventListener('mouseover', e => { const b = e.target.closest('button'); peek(b && !hidden.has(b.dataset.g) ? b.dataset.g : null); });
    rows.addEventListener('mouseleave', () => peek(null));
    root.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const g = b.dataset.g; if (hidden.has(g)) hidden.delete(g); else hidden.add(g);
      b.setAttribute('aria-pressed', hidden.has(g) ? 'false' : 'true');
      peek(hidden.has(g) ? null : g);
      document.dispatchEvent(new CustomEvent('dp:filter', { detail: { hidden: [...hidden] } }));
    });
    document.addEventListener('dp:shown', e => { hidden.delete(e.detail.g); const b = rows.querySelector(`button[data-g="${e.detail.g}"]`); if (b) b.setAttribute('aria-pressed', 'true'); });
  })();
  </script>
</section>
<aside id="detail" aria-live="polite">
  <style>
    #detail { position:fixed; top:calc(var(--head) + 14px); right:24px; bottom:24px; width:var(--panel); z-index:6; overflow:auto;
              background:linear-gradient(135deg, var(--zig) 25%, transparent 25%) left top / 14px 7px repeat-x,
                         linear-gradient(225deg, var(--zig) 25%, transparent 25%) left top / 14px 7px repeat-x,
                         linear-gradient(var(--corner-c), var(--corner-c)) left top / 14px 1.5px no-repeat,
                         linear-gradient(var(--corner-c), var(--corner-c)) left top / 1.5px 14px no-repeat,
                         linear-gradient(var(--corner-c), var(--corner-c)) right bottom / 14px 1.5px no-repeat,
                         linear-gradient(var(--corner-c), var(--corner-c)) right bottom / 1.5px 14px no-repeat, var(--sheet);
              border-radius:var(--panel-radius); box-shadow:var(--shadow); padding:28px 26px 30px; backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
              opacity:0; transform:translateX(28px) scale(.985); pointer-events:none; transition:opacity .24s ease, transform .4s cubic-bezier(.2,.8,.2,1); }
    #detail.open { opacity:1; transform:none; pointer-events:auto; }
    #detail .close { position:absolute; right:14px; top:14px; width:34px; height:34px; border-radius:10px; color:var(--muted); font-size:19px; }
    #detail .close:hover { background:var(--tint); color:var(--ink); }
    #detail .kind { display:flex; align-items:center; gap:8px; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    #detail h2 { margin:12px 34px 8px 0; font:var(--display-style) var(--display-weight) 27px/1.12 var(--serif); letter-spacing:-.012em; overflow-wrap:anywhere; }
    #detail h2.long { font-size:20px; line-height:1.25; }
    #detail .facts { display:flex; gap:22px; margin:14px 0 0; }
    #detail .facts div { display:flex; flex-direction:column-reverse; }
    #detail .facts dt { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    #detail .facts dd { margin:0; font:var(--display-weight) 22px/1.1 var(--serif); font-variant-numeric:tabular-nums; color:var(--figure); }
    #detail h3 { display:flex; align-items:baseline; gap:8px; margin:28px 0 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; }
    #detail h3 em { font-style:normal; color:var(--faint); font-weight:500; }
    #detail h3 .arrow { font-size:12px; letter-spacing:0; }
    #detail ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
    #detail li { background:var(--row); border-radius:calc(var(--radius) - 4px); padding:10px 13px; animation:detail-in .42s cubic-bezier(.2,.8,.2,1) both; transition:background .15s; }
    #detail li:hover { background:var(--row-hover); }
    #detail li:nth-child(2) { animation-delay:.035s; } #detail li:nth-child(3) { animation-delay:.07s; } #detail li:nth-child(4) { animation-delay:.105s; }
    #detail li:nth-child(5) { animation-delay:.14s; } #detail li:nth-child(n+6) { animation-delay:.175s; }
    #detail .to { display:flex; align-items:center; gap:9px; font-weight:500; text-align:left; transition:color .15s; }
    #detail .to:hover { color:var(--accent); }
    #detail .arrow.out { color:var(--out); }
    #detail .arrow.in { color:var(--in); }
    #detail q { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; margin-top:5px; color:var(--muted); font-size:12.5px; quotes:none; }
    #detail .src { display:block; margin-top:4px; color:var(--faint); font-size:11.5px; }
    #detail .note b { display:block; font-weight:500; }
    #detail .note span { color:var(--muted); font-size:12px; }
    #detail .old { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--in-soft); color:var(--in); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; }
    #detail .more { margin-top:10px; padding:7px 12px; border-radius:10px; color:var(--accent); font-size:12.5px; font-weight:500; background:var(--accent-soft); }
    #detail .more:hover { background:var(--accent-soft-2); }
    @keyframes detail-in { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { #detail, #detail li { transition:none; animation:none; } }
  </style>
  <button class="close" title="Close (Esc)">×</button>
  <div class="body"></div>
  <script>
  (() => {
    const meta = DP.read('data-meta'), groups = DP.read('data-groups'), things = DP.read('data-things'), links = DP.read('data-links'), notes = DP.read('data-notes');
    const colour = Object.fromEntries(groups.map(g => [g.g, g.color])), named = meta.isles || {}, back = meta.inverse || {};
    const root = document.getElementById('detail'), body = root.querySelector('.body');
    const byId = new Map(things.map((t, i) => [t.id, i]));
    const OUT = { 'uses': 'Uses', 'measured-by': 'Measured by', 'evaluated-on': 'Evaluated on', 'owned-by': 'Owned by', 'replaces': 'Replaces',
                  'part-of': 'Part of', 'trained-on': 'Trained on', 'produces': 'Produces', 'shows': 'Shows', 'compared-with': 'Compared with' };
    const IN = { 'uses': 'Used by', 'measured-by': 'Measures', 'evaluated-on': 'Evaluation set for', 'owned-by': 'Owns', 'replaces': 'Replaced by',
                 'part-of': 'Has as a part', 'trained-on': 'Training data for', 'produces': 'Produced by', 'shows': 'Shown in', 'compared-with': 'Compared with' };
    const say = (ty, out) => (out ? OUT[ty] : IN[ty] || back[ty])                     // the memory's own EDGES.md reads it backwards
      || (ty.replace(/^other\//, '').replace(/-/g, ' ').replace(/^./, c => c.toUpperCase()) + (out ? '' : ', from'));
    const SHOW = 5;
    const more = rows => rows.length > SHOW ? `<button class="more" data-rest="${DP.esc(encodeURIComponent(rows.slice(SHOW).join('')))}">Show ${DP.num(rows.length - SHOW)} more</button>` : '';
    let pointedId = null;
    const point = id => { if (id !== pointedId) { pointedId = id; document.dispatchEvent(new CustomEvent('dp:point', { detail: { id } })); } };
    const render = i => {
      const t = things[i], mine = links.filter(l => l.s === i || l.t === i), sets = new Map();
      mine.forEach(l => { const out = l.s === i, key = (out ? 'o:' : 'i:') + l.type; if (!sets.has(key)) sets.set(key, { out, type: l.type, rows: [] }); sets.get(key).rows.push(l); });
      const blocks = [...sets.values()].sort((a, b) => b.out - a.out || b.rows.length - a.rows.length).map(s => {
        const rows = s.rows.map(l => {
          const o = things[s.out ? l.t : l.s], n = notes[l.note];
          return `<li><button class="to" data-id="${DP.esc(o.id)}"><span class="dot" data-c="${colour[o.g]}"></span>${DP.esc(o.label)}</button>`
            + (l.q ? `<q>“${DP.esc(l.q)}”</q>` : '') + (n ? `<span class="src">${DP.esc(n.p.replace(/\.md$/, ''))}</span>` : '') + '</li>';
        });
        return `<h3><span class="arrow ${s.out ? 'out' : 'in'}">${s.out ? '→' : '←'}</span>${DP.esc(say(s.type, s.out))} <em>${DP.num(s.rows.length)}</em></h3><ul>${rows.slice(0, SHOW).join('')}</ul>${more(rows)}`;
      }).join('');
      const ns = (t.notes || []).map(k => notes[k]).filter(Boolean).sort((a, b) => (b.d || '').localeCompare(a.d || ''));
      const noteRows = ns.map(n => `<li class="note"><b>${DP.esc(n.t)}</b><span>${DP.esc(n.a || 'top level')} · ${DP.esc(n.d || '')} · ${DP.esc(n.k)}</span>${n.old ? '<span class="old">replaced</span>' : ''}</li>`);
      const where = (named[t.home] || {}).name || t.home || 'shared by several projects';
      body.innerHTML = `<div class="kind"><span class="dot" data-c="${colour[t.g]}"></span>${DP.esc(t.type)} · ${DP.esc(where)}</div>`
        + `<h2${t.label.length > 44 ? ' class="long"' : ''}>${DP.esc(t.label)}</h2>`
        + `<dl class="facts">${meta.notes ? `<div><dt>notes</dt><dd>${DP.num(t.n)}</dd></div>` : ''}<div><dt>links</dt><dd>${DP.num(mine.length)}</dd></div></dl>`
        + blocks + (ns.length ? `<h3>Notes that name it <em>${DP.num(ns.length)}</em></h3><ul>${noteRows.slice(0, SHOW).join('')}</ul>${more(noteRows)}` : '');
      body.querySelectorAll('.dot[data-c]').forEach(d => { d.style.background = DP.tone(d.dataset.c, groups); });
      pointedId = null; root.scrollTop = 0; root.classList.add('open');
    };
    document.addEventListener('dp:select', e => { const i = e.detail.id == null ? undefined : byId.get(e.detail.id); if (i === undefined) root.classList.remove('open'); else render(i); });
    document.addEventListener('dp:theme', () => body.querySelectorAll('.dot[data-c]').forEach(d => { d.style.background = DP.tone(d.dataset.c, groups); }));
    root.addEventListener('mouseover', e => { const li = e.target.closest('li'), to = li && li.querySelector('.to'); point(to ? to.dataset.id : null); });
    root.addEventListener('mouseleave', () => point(null));
    root.addEventListener('click', e => {
      const to = e.target.closest('.to'); if (to) { document.dispatchEvent(new CustomEvent('dp:focus', { detail: { id: to.dataset.id } })); return; }
      const m = e.target.closest('.more');
      if (m) { const ul = m.previousElementSibling; ul.insertAdjacentHTML('beforeend', decodeURIComponent(m.dataset.rest)); ul.querySelectorAll('.dot[data-c]').forEach(d => { d.style.background = DP.tone(d.dataset.c, groups); }); m.remove(); return; }
      if (e.target.closest('.close')) document.dispatchEvent(new CustomEvent('dp:clear', { detail: {} }));
    });
  })();
  </script>
</aside>
