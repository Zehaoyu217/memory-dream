<!doctype html>
<!-- what: a knowledge graph: every thing and every link between two of them, on islands by project, folder or community | for: showing what a memory (or any graph) holds, offline, in one file (filled by memory.py write_kg, or demo/knowledge-graph/build.py) -->
<html lang="en" data-theme="@@THEME@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<script id="pkg-d3">
@@D3@@
</script>

<script id="lib">
const DP = {
  read: id => JSON.parse(document.getElementById(id).textContent),
  esc: s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]),
  num: n => Number(n).toLocaleString('en-US'),
  still: () => matchMedia('(prefers-reduced-motion: reduce)').matches,
  look: () => document.documentElement.dataset.theme || 'paper',   // paper, star (a star map), gala (a purple show), moon (moonlit)
  tone: (c, groups) => {             // a group's colour for the look in use: the star map lifts it so it glows on the dark;
    const look = DP.look();          // the gala gives each group a colour of its show, by its place among `groups` (the legend's order)
    if (look === 'paper') return c;
    if (look === 'gala' || look === 'moon' || look === 'fanfare' || look === 'noir') {   // each show look has its own eight, in the legend's order
      const i = (groups || []).findIndex(g => g.color === c), pal = {
        gala: ['#ff6fcf', '#b48bff', '#62d4ff', '#ffd36e', '#7fe3b8', '#ff9478', '#e3bdff', '#8fa8ff'],
        moon: ['#4b2a6b', '#7b5cd6', '#d6457f', '#5f7ee0', '#d4a24c', '#3fae9a', '#a98be6', '#e07a9e'],
        fanfare: ['#ffd35c', '#7ee7ff', '#ff8fd8', '#ffffff', '#c9a8ff', '#8ff0b8', '#ffb37a', '#a8b8ff'],
        noir: ['#f4f2f8', '#b9b6c4', '#a67cff', '#e2c27a', '#d9c8ff', '#e889c9', '#a9dcef', '#8a8696'] }[look];   // white and silver first
      return i >= 0 && groups[i].g !== 'other' ? pal[i % 8] : { gala: '#cfc6e4', moon: '#a49cb8', fanfare: '#ddd3f5', noir: '#5e5a69' }[look];
    }
    const h = d3.hsl(c); h.l = Math.min(0.8, Math.max(0.64, h.l + 0.26)); h.s = Math.min(0.92, h.s * 1.3 + 0.08); return h.formatHex();
  },
  // tags: a thing holds in each tag column a value or several, each a path whose levels are split by '/'
  // (dataset/table/daily). A facet is a column as colours: the seven top-level values with the most things (each with
  // 2% of them) a colour each, the column's own hue for a value when it has one, else a spare; the rest one grey
  spare: ['#3d8fa8', '#c08457', '#7d8b4a', '#a46a9a', '#5a6fb0', '#9c7a54', '#5e9c8f'],
  grey: '#b9bec5',
  vals: (t, key) => { const v = (t.tags || {})[key]; return v == null || v === '' ? [] : Array.isArray(v) ? v : [v]; },
  name: (col, path) => (col.names || {})[path]
    || (path ? path.split('/').pop().replace(/[-_]+/g, ' ').replace(/^./, c => c.toUpperCase()) : `No ${col.name.toLowerCase()}`),
  trail: (col, path) => path.split('/').map((s, d, a) => DP.name(col, a.slice(0, d + 1).join('/'))).join(' › '),   // Datasets › Tables
  holds: (vals, sel) => sel.none ? !vals.length : sel.exact ? vals.includes(sel.path)                               // a legend row's
    : vals.some(v => v === sel.path || v.startsWith(sel.path + '/')),                                               // things
  facet: (things, col) => {
    const N = things.length, count = new Map();
    const tops = things.map(t => [...new Set(DP.vals(t, col.key).map(v => v.split('/')[0]))]);
    tops.forEach(ts => ts.forEach(v => count.set(v, (count.get(v) || 0) + 1)));
    const keep = [...count].filter(([v, n]) => v !== 'other' && n >= Math.max(2, 0.02 * N))
      .sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, 7).map(([v]) => v);
    const used = new Set(), rows = keep.map(v => {
      let c = (col.colours || {})[v]; if (!c || used.has(c)) c = DP.spare.find(s => !used.has(s)) || DP.grey; used.add(c);
      return { g: v, path: v, name: DP.name(col, v), color: c, n: count.get(v) };
    });
    const at = new Map(keep.map((v, k) => [v, k]));
    const top = Int16Array.from(tops, ts => { for (const v of ts) if (at.has(v)) return at.get(v); return -1; });
    const rest = top.reduce((s, x) => s + (x < 0 ? 1 : 0), 0);
    if (rest) rows.push({ g: 'other', rest: true, name: 'Everything else', color: DP.grey, n: rest });
    return { col, rows, top };
  },
};
</script>
</head>
<body>
<header id="masthead" data-span="full">
  <style>
    #masthead { position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:40px; padding:26px 40px 20px; color:var(--page-ink); }
    #masthead > * { animation:masthead-up .9s cubic-bezier(.2,.8,.2,1) both; }
    #masthead dl { animation-delay:.18s; }
    #masthead h1 { margin:8px 0 6px; font:var(--display-style) var(--display-weight) 32px/1.08 var(--serif); letter-spacing:-.012em; }
    #masthead h1::after { content:var(--title-mark); margin-left:.3em; font-size:.6em; vertical-align:.5em; color:var(--label); }
    #masthead p { margin:0; color:var(--page-muted); max-width:820px; }
    #masthead dl { display:flex; gap:40px; margin:0 0 2px; }
    #masthead dl div { display:flex; flex-direction:column-reverse; gap:3px; }
    #masthead dt { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--page-muted); }
    #masthead dd { margin:0; font:var(--display-weight) 28px/1 var(--serif); font-variant-numeric:tabular-nums; color:var(--figure); }
    #masthead .looks { position:absolute; top:18px; right:40px; display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--tint);
                       animation-delay:.3s; transition:background .5s; }
    #masthead .looks button { height:26px; padding:0 12px; border-radius:999px; font-size:12px; color:var(--page-muted); transition:color .2s, background .3s, box-shadow .3s; }
    #masthead .looks button:hover { color:var(--page-ink); }
    #masthead .looks button[aria-pressed="true"] { background:var(--sheet); color:var(--ink); box-shadow:0 0 0 1px var(--accent-soft-2); }
    @keyframes masthead-up { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @media (max-width:980px) { #masthead dl { display:none; } }
    @media (prefers-reduced-motion: reduce) { #masthead > * { animation:none; } }
  </style>
  <div>
    <div class="eyebrow">@@EYEBROW@@</div>
    <h1>@@HEADLINE@@</h1>
    <p>@@LEDE@@</p>
  </div>
  <dl>@@STATS@@</dl>
  <div class="looks" role="group" aria-label="The look of the page"><button data-look="paper">Paper</button><button data-look="star">Star map</button><button data-look="gala">Gala</button><button data-look="moon">Moonlit</button><button data-look="fanfare">Fanfare</button><button data-look="noir">Noir</button></div>
  <script>
  (() => {
    const looks = document.querySelector('#masthead .looks');
    const show = () => looks.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.look === DP.look() ? 'true' : 'false'));
    looks.addEventListener('click', e => {             // the look is a view, like a tab: one attribute on the page, then word to the rest
      const b = e.target.closest('button'); if (!b || b.dataset.look === DP.look()) return;
      document.documentElement.dataset.theme = b.dataset.look; show();
      document.dispatchEvent(new CustomEvent('dp:theme', { detail: { theme: b.dataset.look } }));
    });
    show();
    if (DP.still()) return;
    document.querySelectorAll('#masthead dd').forEach((dd, k) => {   // the numbers count up as the graph blooms
      const to = Number(dd.textContent.replace(/[^0-9]/g, '')), t0 = performance.now() + 220 + 90 * k;
      const step = now => { const p = Math.max(0, Math.min(1, (now - t0) / 1500)); dd.textContent = DP.num(Math.round(to * d3.easeCubicOut(p))); if (p < 1) requestAnimationFrame(step); };
      dd.textContent = '0'; requestAnimationFrame(step);
    });
  })();
  </script>
</header>
<script type="application/json" id="data-meta">
@@META@@
</script>
<script type="application/json" id="data-columns">
@@COLUMNS@@
</script>

@@THINGS@@

@@LINKS@@
</script>

@@NOTES@@
</script>
<section id="graph" data-span="full">
  <style>
    #graph { position:relative; min-height:0; }
    #graph canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; transition:opacity .28s; }
    #graph.switching canvas { opacity:0; }
    #graph canvas.over { cursor:pointer; }
    #graph canvas.held { cursor:grabbing; }
    #graph .tools { position:absolute; right:24px; bottom:24px; display:flex; align-items:flex-end; gap:10px; transition:right .45s cubic-bezier(.2,.8,.2,1); animation:graph-rise .8s .6s cubic-bezier(.2,.8,.2,1) both; }

      if (k >= stops.length) { stopTour(); choose(null, true); fly(fitAll(), 1400); return; }
      const n = stops[k];
      if (hideM[n.i]) document.dispatchEvent(new CustomEvent('dp:reveal', { detail: { id: n.id } }));
      tourText.textContent = `Stop the tour · ${k + 1} of ${stops.length}`;
      choose(n, true); frameOn(n);
      touring = setTimeout(() => step(k + 1), 5600);
    }
    tourBtn.addEventListener('click', () => {
      lastInput = performance.now();
      if (touring) { stopTour(); return; }
      tourBtn.classList.add('on'); tourIcon.textContent = '■';
      touring = setTimeout(() => step(0), 10);
    });

    // ---- start: a little closer than the whole, then the camera eases out as the islands bloom
    ready = true;
    const whole = fitAll();
    sel.call(zoom.transform, whole);
    if (!still) {
      const s = inset();
      sel.call(zoom.scaleBy, 1.22, [s.l + (W - s.l - s.r) / 2, s.t + (H - s.t - s.b) / 2]);
      sel.transition().delay(120).duration(2800).ease(cubicOut).call(zoom.transform, whole);
    }
    setTimeout(() => hint.classList.add('gone'), 10000);
    need();
  })();
  </script>

  <script>
  (() => {
    const meta = DP.read('data-meta'), columns = DP.read('data-columns'), things = DP.read('data-things');
    const root = document.getElementById('search'), box = root.querySelector('.box'), input = root.querySelector('input'), list = root.querySelector('ul'), kbd = root.querySelector('kbd');
    const cats = columns.filter(c => !c.text), texts = columns.filter(c => c.text);
    let col = cats[0] || columns[0], facet = DP.facet(things, col), lit = null;
    const norm = s => String(s).toLowerCase().replace(/[-_]+/g, ' ');
    const index = things.map((t, i) => ({ t, i, n: t.n, keys: [t.label, ...(t.names || []), t.id, ...texts.flatMap(c => DP.vals(t, c.key))].map(s => String(s).toLowerCase()) }));
    const tags = [];                                     // every level of every value of every tag column, and how many hold it
    cats.forEach(c => {
      const n = new Map();
      things.forEach(t => { const seen = new Set(); DP.vals(t, c.key).forEach(v => { const seg = v.split('/'); for (let d = 1; d <= seg.length; d++) seen.add(seg.slice(0, d).join('/')); });
        seen.forEach(p => n.set(p, (n.get(p) || 0) + 1)); });
      n.forEach((k, p) => tags.push({ tag: true, c, key: c.key, path: p, n: k, name: DP.name(c, p), trail: DP.trail(c, p), keys: [DP.name(c, p), p, p.split('/').pop()].map(norm) }));
    });
    const leaf = i => { const v = DP.vals(things[i], col.key); return v.length ? v[0].split('/').pop().replace(/[-_]+/g, ' ') : ''; };
    const dot = (top, ring) => { const c = top >= 0 ? facet.rows[top].color : DP.grey; return `<span class="dot${ring ? ' ring' : ''}" data-c="${c}"></span>`; };
    const tone = () => list.querySelectorAll('.dot').forEach(d => { const c = DP.tone(d.dataset.c, facet.rows); if (d.classList.contains('ring')) d.style.color = c; else d.style.background = c; });
    let hits = [], at = 0, q = '';
    const mark = s => { const k = norm(s).indexOf(norm(q)); return k < 0 || !q ? DP.esc(s) : DP.esc(s.slice(0, k)) + '<mark>' + DP.esc(s.slice(k, k + q.length)) + '</mark>' + DP.esc(s.slice(k + q.length)); };
    const render = fresh => {
      list.classList.toggle('fresh', !!fresh);
      list.innerHTML = hits.map((h, k) => h.tag
        ? `<li><button class="${k === at ? 'on' : ''}" data-k="${k}">${dot(h.key === col.key ? facet.rows.findIndex(r => !r.rest && r.path === h.path.split('/')[0]) : -1, true)}<span class="name">${mark(h.trail)}</span><span class="kind">${DP.esc(h.c.name)} · ${DP.num(h.n)} thing${h.n === 1 ? '' : 's'}</span></button></li>`
        : `<li><button class="${k === at ? 'on' : ''}" data-k="${k}">${dot(facet.top[h.i])}<span class="name">${mark(h.t.label)}</span><span class="kind">${DP.esc(leaf(h.i))}${meta.notes ? ` · ${DP.num(h.t.n)} note${h.t.n === 1 ? '' : 's'}` : ''}</span></button></li>`).join('');
      tone();
    };
    const find = () => {                                 // the best first; a tag before a thing that scores the same
      if (!q) return [];
      const score = (keys, w) => keys.some(k => k === w) ? 3 : keys.some(k => k.startsWith(w)) ? 2 : keys.some(k => k.includes(w)) ? 1 : 0;
      const a = index.map(x => [score(x.keys, q), 0, x.n, x]), b = tags.map(x => [score(x.keys, norm(q)), 1, x.n, x]);
      return a.concat(b).filter(s => s[0]).sort((u, v) => v[0] - u[0] || v[1] - u[1] || v[2] - u[2]).slice(0, 8).map(s => s[3]);
    };
    const light = h => {                                 // a tag lights its things, and stays lit until Esc
      lit = h; box.classList.toggle('lit', !!h); kbd.textContent = h ? 'esc' : '/';
      if (h) input.value = h.name;
      document.dispatchEvent(new CustomEvent('dp:light', { detail: { sel: h ? { key: h.key, path: h.path } : null, name: h ? h.name : '' } }));
    };
    const go = h => {
      if (!h) return;
      hits = []; render(); input.blur();
      if (h.tag) light(h); else document.dispatchEvent(new CustomEvent('dp:focus', { detail: { id: h.t.id } }));
    };
    input.addEventListener('input', () => { if (lit) light(null); const was = hits.length; q = input.value.trim().toLowerCase(); hits = find(); at = 0; render(!was); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { at = Math.min(hits.length - 1, at + 1); render(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { at = Math.max(0, at - 1); render(); e.preventDefault(); }
      else if (e.key === 'Enter') go(hits[at]);
      else if (e.key === 'Escape') { input.value = ''; q = ''; hits = []; render(); input.blur(); if (lit) light(null); document.dispatchEvent(new CustomEvent('dp:clear', { detail: {} })); }
    });
    list.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(hits[+b.dataset.k]); });
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); input.select(); }
      else if (e.key === 'Escape' && lit && document.activeElement !== input) { input.value = ''; light(null); }
    });
    document.addEventListener('dp:light', e => {        // lit from elsewhere (a tag in the panel): the box says what is lit
      if (!e.detail.sel || (lit && lit.key === e.detail.sel.key && lit.path === e.detail.sel.path)) return;
      lit = tags.find(x => x.key === e.detail.sel.key && x.path === e.detail.sel.path) || null;
      box.classList.toggle('lit', !!lit); kbd.textContent = lit ? 'esc' : '/'; if (lit) input.value = lit.name;
    });
    document.addEventListener('dp:colour', e => { col = columns.find(c => c.key === e.detail.key) || col; facet = DP.facet(things, col); render(); });
    document.addEventListener('dp:theme', tone);
  })();
  </script>

  <div class="cols" role="group" aria-label="Colour the things by"></div>
  <div class="rows" role="tree"></div>
  <div class="key"><span><b class="out">→</b>what it uses</span><span><b class="in">←</b>what uses it</span></div>
  <div class="help">Point to light, click to hide, › to open.</div>
  <script>
  (() => {
    const columns = DP.read('data-columns'), things = DP.read('data-things');
    const root = document.getElementById('legend'), eyebrow = root.querySelector('.eyebrow'), cols = root.querySelector('.cols'), rows = root.querySelector('.rows');
    const byId = new Map(things.map((t, i) => [t.id, i]));
    const cats = columns.filter(c => !c.text);           // a text tag (a definition) is read in the panel, not listed
    let col = cats[0] || columns[0], facet = DP.facet(things, col), tree = null, hidden = [], sels = [], peeked = '';
    const open = new Set(), shown = new Map();
    const id = s => `${s.key}|${s.rest ? '*' : s.none ? '-' : (s.exact ? '=' : '') + s.path}`;
    const strip = s => Object.assign({ key: s.key, path: s.path }, s.rest ? { rest: true } : {}, s.none ? { none: true } : {}, s.exact ? { exact: true } : {});
    const grow = () => {                                 // every path of the column and its levels: how many things lie under it,
      const T = new Map(), at = p => { let x = T.get(p); if (!x) T.set(p, x = { n: 0, self: 0, kids: new Set(), seen: -1, own: -1 }); return x; };
      things.forEach((t, i) => DP.vals(t, col.key).forEach(v => {   // how many hold it and nothing under it, which lie just below
        const seg = v.split('/');
        for (let d = 1; d <= seg.length; d++) {
          const p = seg.slice(0, d).join('/'), x = at(p);
          if (x.seen !== i) { x.n++; x.seen = i; }
          if (d > 1) at(seg.slice(0, d - 1).join('/')).kids.add(p);
          if (d === seg.length && x.own !== i) { x.self++; x.own = i; }
        }
      }));
      return T;
    };
    const below = s => {                                 // the rows a row opens into
      if (s.rest) {                                      // the top-level values without a colour, then the things with no value
        const n = new Map(); let none = 0;
        things.forEach((t, i) => { if (facet.top[i] >= 0) return; const vs = DP.vals(t, col.key); if (!vs.length) { none++; return; }
          new Set(vs.map(v => v.split('/')[0])).forEach(v => n.set(v, (n.get(v) || 0) + 1)); });
        return [...n].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).map(([v, k]) => ({ key: col.key, path: v, n: k }))
          .concat(none ? [{ key: col.key, path: '', none: true, n: none }] : []);
      }
      const x = tree.get(s.path); if (!x || s.exact || s.none) return [];
      const out = [...x.kids].map(p => ({ key: col.key, path: p, n: tree.get(p).n })).sort((a, b) => b.n - a.n || (a.path < b.path ? -1 : 1));
      return x.self && out.length ? out.concat([{ key: col.key, path: s.path, exact: true, n: x.self }]) : out;
    };
    const opens = s => s.rest || (!s.exact && !s.none && (tree.get(s.path) || { kids: new Set() }).kids.size > 0);
    const ups = s => {                                   // a row and those above it: hiding any of them hides it
      const out = [id(s)]; if (s.rest) return out;
      if (s.none) return out.concat([id({ key: col.key, rest: true })]);
      const seg = s.path.split('/');
      for (let d = seg.length - (s.exact ? 0 : 1); d >= 1; d--) out.push(id({ key: col.key, path: seg.slice(0, d).join('/') }));
      if (!facet.rows.some(r => !r.rest && r.path === seg[0])) out.push(id({ key: col.key, rest: true }));
      return out;
    };
    const naming = s => s.rest ? 'Everything else' : s.none ? DP.name(col, '') : s.exact ? 'Other ' + DP.name(col, s.path).toLowerCase() : DP.name(col, s.path);
    const tone = () => rows.querySelectorAll('.dot').forEach(d => { d.style.background = DP.tone(d.dataset.c, facet.rows); });
    function draw() {
      eyebrow.textContent = cats.length > 1 ? 'Things by' : 'Things';
      cols.innerHTML = cats.length > 1 ? cats.map(c => `<button aria-pressed="${c === col}" data-key="${DP.esc(c.key)}">${DP.esc(c.name)}</button>`).join('') : '';
      const hid = new Set(hidden.map(id)), out = []; sels = [];
      const row = (s, depth, color) => {
        const k = id(s), up = ups(s), own = hid.has(k), off = up.some(u => hid.has(u)), has = opens(s), isOpen = has && open.has(k), name = naming(s);
        sels.push(s); const j = sels.length - 1;
        out.push(`<div class="row${depth ? ' sub' : ''}" data-depth="${Math.min(depth, 4)}" role="treeitem"${off ? ' data-off=""' : ''}${has ? ` aria-expanded="${isOpen}"` : ''}>`
          + `<button class="tag" data-j="${j}" aria-pressed="${!own}"${off && !own ? ' disabled' : ''}><span class="dot" data-c="${color}"></span>`
          + `<span class="name">${DP.esc(name)}</span><span class="n">${DP.num(s.n)}</span></button>`
          + `<button class="open${has ? '' : ' none'}" data-j="${j}" aria-label="Open ${DP.esc(name)}" aria-expanded="${isOpen}"${has ? '' : ' tabindex="-1"'}>›</button></div>`);
        if (!isOpen) return;
        const kids = below(s), cap = shown.get(k) || 24;
        kids.slice(0, cap).forEach(c => row(c, depth + 1, color));
        if (kids.length > cap) out.push(`<button class="more" data-more="${DP.esc(k)}">Show ${DP.num(kids.length - cap)} more</button>`);
      };
      facet.rows.forEach(r => row(r.rest ? { key: col.key, rest: true, n: r.n } : { key: col.key, path: r.path, n: r.n }, 0, r.color));
      rows.innerHTML = out.join('');
      tone();
    }
    const peek = s => { const k = s ? id(s) : ''; if (k !== peeked) { peeked = k; document.dispatchEvent(new CustomEvent('dp:peek', { detail: { sel: s ? strip(s) : null } })); } };
    const tell = () => document.dispatchEvent(new CustomEvent('dp:filter', { detail: { hidden: hidden.slice() } }));
    rows.addEventListener('mouseover', e => { const b = e.target.closest('.tag'); peek(b && !b.disabled && b.getAttribute('aria-pressed') === 'true' ? sels[+b.dataset.j] : null); });
    rows.addEventListener('mouseleave', () => peek(null));
    root.addEventListener('click', e => {
      const c = e.target.closest('.cols button');
      if (c) {                                           // colour by another column: it starts with nothing hidden or open
        const next = columns.find(x => x.key === c.dataset.key); if (!next || next === col) return;
        col = next; facet = DP.facet(things, col); tree = grow(); open.clear(); shown.clear();
        if (hidden.length) { hidden = []; tell(); }
        peek(null); document.dispatchEvent(new CustomEvent('dp:colour', { detail: { key: col.key } })); draw(); return;
      }
      const m = e.target.closest('.more'); if (m) { shown.set(m.dataset.more, (shown.get(m.dataset.more) || 24) + 48); draw(); return; }
      const o = e.target.closest('.open'); if (o) { const k = id(sels[+o.dataset.j]); if (open.has(k)) open.delete(k); else open.add(k); draw(); return; }
      const b = e.target.closest('.tag'); if (!b || b.disabled) return;
      const s = sels[+b.dataset.j], k = id(s), at = hidden.findIndex(h => id(h) === k);
      if (at >= 0) hidden.splice(at, 1); else hidden.push(strip(s));
      tell(); draw(); peek(at >= 0 ? s : null);
    });
    document.addEventListener('dp:reveal', e => {        // a hidden thing was picked: whatever hides it shows again
      const i = byId.get(e.detail.id); if (i === undefined) return;
      const left = hidden.filter(s => !(s.rest ? facet.top[i] < 0 : DP.holds(DP.vals(things[i], s.key), s)));
      if (left.length !== hidden.length) { hidden = left; tell(); draw(); }
    });
    document.addEventListener('dp:theme', tone);
    tree = grow(); draw();
  })();
  </script>

    #detail .facts div { display:flex; flex-direction:column-reverse; }
    #detail .facts dt { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    #detail .facts dd { margin:0; font:var(--display-weight) 22px/1.1 var(--serif); font-variant-numeric:tabular-nums; color:var(--card-figure); }
    #detail .tags { display:grid; grid-template-columns:auto 1fr; gap:7px 14px; margin:18px 0 0; align-items:baseline; }
    #detail .tags div { display:contents; }
    #detail .texts { margin:16px 0 0; }
    #detail .texts dt { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    #detail .texts dd { margin:4px 0 10px; }
    #detail .texts p { margin:0 0 4px; font-size:13.5px; line-height:1.5; color:var(--ink); }
    #detail .tags dt { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    #detail .tags dd { display:flex; flex-wrap:wrap; gap:4px; margin:0; }
    #detail .chip { padding:2px 9px; border-radius:999px; background:var(--tint); font-size:12px; color:var(--ink); transition:background .15s, color .15s; }
    #detail .chip:hover { background:var(--accent-soft); color:var(--accent); }
    #detail .tags em { font-style:normal; font-size:12px; color:var(--faint); padding:2px 4px; }
    #detail h3 { display:flex; align-items:baseline; gap:8px; margin:28px 0 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; }
    #detail h3 em { font-style:normal; color:var(--faint); font-weight:500; }
    #detail h3 .arrow { font-size:12px; letter-spacing:0; }
    #detail ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
    #detail li { position:relative; background:var(--row); border-radius:calc(var(--radius) - 4px); padding:10px 13px; animation:detail-in .42s cubic-bezier(.2,.8,.2,1) both; transition:background .15s; }
    #detail li::before { content:var(--tail); position:absolute; left:-6px; top:13px; border:6px solid transparent; border-left:0; border-right-color:var(--row); transition:border-color .15s; }
    #detail li:hover::before { border-right-color:var(--row-hover); }
    #detail li:hover { background:var(--row-hover); }
    #detail li:nth-child(2) { animation-delay:.035s; } #detail li:nth-child(3) { animation-delay:.07s; } #detail li:nth-child(4) { animation-delay:.105s; }
    #detail li:nth-child(5) { animation-delay:.14s; } #detail li:nth-child(n+6) { animation-delay:.175s; }
    #detail .to { display:flex; align-items:center; gap:9px; font-weight:500; text-align:left; transition:color .15s; }
    #detail .to:hover { color:var(--accent); }
    #detail .arrow.out { color:var(--out); }
    #detail .arrow.in { color:var(--in); }
    #detail q { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; margin-top:5px; color:var(--muted); font-size:12.5px; quotes:none; }
    #detail .src { display:block; margin-top:4px; color:var(--faint); font-size:11.5px; }
    #detail .note b { display:block; font-weight:500; }
    #detail .note span { color:var(--muted); font-size:12px; }
    #detail .old { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--in-soft); color:var(--in); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; }
    #detail .more { margin-top:10px; padding:7px 12px; border-radius:10px; color:var(--accent); font-size:12.5px; font-weight:500; background:var(--accent-soft); }
    #detail .more:hover { background:var(--accent-soft-2); }
    @keyframes detail-in { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { #detail, #detail li { transition:none; animation:none; } }
  </style>
  <button class="close" title="Close (Esc)">×</button>
  <div class="body"></div>
  <script>
  (() => {
    const meta = DP.read('data-meta'), columns = DP.read('data-columns'), things = DP.read('data-things'), links = DP.read('data-links'), notes = DP.read('data-notes');
    const named = meta.isles || {}, back = meta.inverse || {}, fwd = meta.forward || {};
    const cats = columns.filter(c => !c.text), texts = columns.filter(c => c.text);
    let col = cats[0] || columns[0], facet = DP.facet(things, col), at = -1;
    const hueOf = i => { const k = facet.top[i]; return k >= 0 ? facet.rows[k].color : DP.grey; };
    const tone = () => body.querySelectorAll('.dot[data-c]').forEach(d => { d.style.background = DP.tone(d.dataset.c, facet.rows); });
    const root = document.getElementById('detail'), body = root.querySelector('.body');
    const byId = new Map(things.map((t, i) => [t.id, i]));
    const OUT = { 'uses': 'Uses', 'measured-by': 'Measured by', 'evaluated-on': 'Evaluated on', 'owned-by': 'Owned by', 'replaces': 'Replaces',
                  'part-of': 'Part of', 'trained-on': 'Trained on', 'produces': 'Produces', 'shows': 'Shows', 'compared-with': 'Compared with' };
    const IN = { 'uses': 'Used by', 'measured-by': 'Measures', 'evaluated-on': 'Evaluation set for', 'owned-by': 'Owns', 'replaces': 'Replaced by',
                 'part-of': 'Has as a part', 'trained-on': 'Training data for', 'produces': 'Produced by', 'shows': 'Shown in', 'compared-with': 'Compared with' };
    const say = (ty, out) => (out ? fwd[ty] || OUT[ty] : back[ty] || IN[ty])         // the graph's own words first (EDGES.md, link_types)
      || (ty.replace(/^other\//, '').replace(/-/g, ' ').replace(/^./, c => c.toUpperCase()) + (out ? '' : ', from'));
    const SHOW = 5;
    const more = rows => rows.length > SHOW ? `<button class="more" data-rest="${DP.esc(encodeURIComponent(rows.slice(SHOW).join('')))}">Show ${DP.num(rows.length - SHOW)} more</button>` : '';
    let pointedId = null;
    const point = id => { if (id !== pointedId) { pointedId = id; document.dispatchEvent(new CustomEvent('dp:point', { detail: { id } })); } };
    const render = i => {
      const t = things[i], mine = links.filter(l => l.s === i || l.t === i), sets = new Map();
      mine.forEach(l => { const out = l.s === i, key = (out ? 'o:' : 'i:') + l.type; if (!sets.has(key)) sets.set(key, { out, type: l.type, rows: [] }); sets.get(key).rows.push(l); });
      const blocks = [...sets.values()].sort((a, b) => b.out - a.out || b.rows.length - a.rows.length).map(s => {
        const rows = s.rows.map(l => {
          const o = things[s.out ? l.t : l.s], n = notes[l.note];
          return `<li><button class="to" data-id="${DP.esc(o.id)}"><span class="dot" data-c="${hueOf(s.out ? l.t : l.s)}"></span>${DP.esc(o.label)}</button>`
            + (l.q ? `<q>“${DP.esc(l.q)}”</q>` : '') + (n ? `<span class="src">${DP.esc(n.p.replace(/\.md$/, ''))}</span>` : '') + '</li>';
        });
        return `<h3><span class="arrow ${s.out ? 'out' : 'in'}">${s.out ? '→' : '←'}</span>${DP.esc(say(s.type, s.out))} <em>${DP.num(s.rows.length)}</em></h3><ul>${rows.slice(0, SHOW).join('')}</ul>${more(rows)}`;
      }).join('');
      const ns = (t.notes || []).map(k => notes[k]).filter(Boolean).sort((a, b) => (b.d || '').localeCompare(a.d || ''));
      const noteRows = ns.map(n => `<li class="note"><b>${DP.esc(n.t)}</b><span>${DP.esc(n.a || 'top level')} · ${DP.esc(n.d || '')} · ${DP.esc(n.k)}</span>${n.old ? '<span class="old">replaced</span>' : ''}</li>`);
      const where = (named[t.home] || {}).name || t.home || 'shared by several projects';
      const kind = (DP.vals(t, col.key)[0] || '').split('/').pop().replace(/[-_]+/g, ' ');
      const textRows = texts.map(c => { const vs = DP.vals(t, c.key); return vs.length ? `<div><dt>${DP.esc(c.name)}</dt><dd>${vs.map(v => `<p>${DP.esc(v)}</p>`).join('')}</dd></div>` : ''; }).join('');
      const tagRows = cats.map(c => { const vs = DP.vals(t, c.key); if (!vs.length) return '';   // its tags, each a way to light its kind
        return `<div><dt>${DP.esc(c.name)}</dt><dd>${vs.slice(0, 6).map(v => `<button class="chip" data-key="${DP.esc(c.key)}" data-path="${DP.esc(v)}" title="Light every thing with it">${DP.esc(DP.trail(c, v))}</button>`).join('')}${vs.length > 6 ? `<em>+${DP.num(vs.length - 6)}</em>` : ''}</dd></div>`; }).join('');
      body.innerHTML = `<div class="kind"><span class="dot" data-c="${hueOf(i)}"></span>${kind ? DP.esc(kind) + ' · ' : ''}${DP.esc(where)}</div>`
        + `<h2${t.label.length > 44 ? ' class="long"' : ''}>${DP.esc(t.label)}</h2>`
        + `<dl class="facts">${meta.notes ? `<div><dt>notes</dt><dd>${DP.num(t.n)}</dd></div>` : ''}<div><dt>links</dt><dd>${DP.num(mine.length)}</dd></div></dl>`
        + (textRows ? `<dl class="texts">${textRows}</dl>` : '') + (tagRows ? `<dl class="tags">${tagRows}</dl>` : '')
        + blocks + (ns.length ? `<h3>Notes that name it <em>${DP.num(ns.length)}</em></h3><ul>${noteRows.slice(0, SHOW).join('')}</ul>${more(noteRows)}` : '');
      tone(); at = i;
      pointedId = null; root.scrollTop = 0; root.classList.add('open');
    };
    document.addEventListener('dp:select', e => { const i = e.detail.id == null ? undefined : byId.get(e.detail.id); if (i === undefined) root.classList.remove('open'); else render(i); });
    document.addEventListener('dp:theme', tone);
    document.addEventListener('dp:colour', e => { col = columns.find(c => c.key === e.detail.key) || col; facet = DP.facet(things, col);
      if (at >= 0 && root.classList.contains('open')) render(at); });
    root.addEventListener('mouseover', e => { const li = e.target.closest('li'), to = li && li.querySelector('.to'); point(to ? to.dataset.id : null); });
    root.addEventListener('mouseleave', () => point(null));
    root.addEventListener('click', e => {
      const to = e.target.closest('.to'); if (to) { document.dispatchEvent(new CustomEvent('dp:focus', { detail: { id: to.dataset.id } })); return; }
      const chip = e.target.closest('.chip');
      if (chip) { const c = columns.find(x => x.key === chip.dataset.key);
        document.dispatchEvent(new CustomEvent('dp:light', { detail: { sel: { key: chip.dataset.key, path: chip.dataset.path }, name: c ? DP.name(c, chip.dataset.path) : chip.dataset.path } })); return; }
      const m = e.target.closest('.more');
      if (m) { const ul = m.previousElementSibling; ul.insertAdjacentHTML('beforeend', decodeURIComponent(m.dataset.rest)); tone(); m.remove(); return; }
      if (e.target.closest('.close')) document.dispatchEvent(new CustomEvent('dp:clear', { detail: {} }));
    });
  })();
  </script>
</aside>
</body>
</html>
